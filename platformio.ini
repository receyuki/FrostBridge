[platformio]
default_envs = gateway

[env]
platform = espressif32 @ 8.0.0
platform_packages =
    platformio/framework-arduinoespressif32 @ 4.30312.261024
    platformio/framework-arduinoespressif32-esp32-libs @ 3.3.12
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800

[env:basic]
build_flags = -DFROSTBRIDGE_BASIC=1

[env:coexistence]
build_flags =
    -DCONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=5
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps =
    homespan/HomeSpan @ 2.1.8
    h2zero/NimBLE-Arduino @ 2.5.1

[env:readout]
extends = env:coexistence
build_flags =
    ${env:coexistence.build_flags}
    -DFROSTBRIDGE_M1=1

[env:gateway]
extra_scripts = pre:scripts/pio_assets.py
extends = env:readout
lib_deps =
    ${env:coexistence.lib_deps}
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    ${env:readout.build_flags}
    -DFROSTBRIDGE_GATEWAY=1

; Production defaults to English. Web Chinese is selected per browser.
[env:gateway_zh]
extends = env:gateway
build_flags =
    ${env:gateway.build_flags}
    -DFROSTBRIDGE_HOMEKIT_ZH=1

; Compatibility alias for existing English build commands.
[env:gateway_en]
extends = env:gateway
