name: Build and host checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python frostbridge.py setup
      - run: python frostbridge.py build
      - run: python frostbridge.py test
      - run: python frostbridge.py build --homekit-language zh-CN
      - run: python frostbridge.py export --output .local/dist/FrostBridge-source.zip
